name: Phase 3 final pinned formatting
on:
  pull_request:
    branches: [phase/02-sdk-foundation]
    paths: [.github/workflows/bootstrap-phase3-format.yml]
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'cryogenized-spec/NeonSales-ClickUp-MCP-' && github.event.pull_request.head.ref == 'phase/03-oauth-identity' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: phase/03-oauth-identity
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.20.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm exec -- prettier --write src tests package.json tsconfig*.json eslint.config.js wrangler.jsonc
      - name: Commit formatter output only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests package.json tsconfig.json tsconfig.auth.json tsconfig.mcp.json eslint.config.js wrangler.jsonc
          git diff --staged --quiet && exit 0
          git commit -m "style(phase3): pin all OAuth and isolated TS profile formatting"
          git pull --ff-only origin phase/03-oauth-identity
          git push origin HEAD:refs/heads/phase/03-oauth-identity
