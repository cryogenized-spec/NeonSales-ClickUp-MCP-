name: Temporary Phase 5 formatting preview (read-only)
on:
  pull_request:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Render formatter output to job log, no repository write permission
        run: |
          npx prettier --write src/clickup src/mcp/create-server.ts src/auth/env.ts src/index.ts tests/phase4-readonly.test.ts tests/phase4-mcp.test.ts tests/tool-catalog.test.ts tests/per-user-oauth.test.ts wrangler.jsonc
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const paths = [
            "src/clickup/user-connection.ts",
            "src/clickup/per-user-oauth.ts",
            "src/clickup/policy.ts",
            "src/clickup/client.ts",
            "src/mcp/create-server.ts",
            "src/auth/env.ts",
            "src/index.ts",
            "tests/phase4-readonly.test.ts",
            "tests/phase4-mcp.test.ts",
            "tests/tool-catalog.test.ts",
            "tests/per-user-oauth.test.ts",
            "wrangler.jsonc",
          ];
          for (const path of paths) {
            console.log("FORMATTED:" + path + "::" + encodeURIComponent(fs.readFileSync(path, "utf8")));
          }
          NODE
