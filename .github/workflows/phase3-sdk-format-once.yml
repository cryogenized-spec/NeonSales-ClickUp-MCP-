name: One-time SDK regression formatting
on:
  pull_request:
    branches: [phase/02-sdk-foundation]
    paths: [.github/workflows/phase3-sdk-format-once.yml]
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'cryogenized-spec/NeonSales-ClickUp-MCP-' && github.event.pull_request.head.ref == 'phase/03-oauth-identity' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: phase/03-oauth-identity
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.20.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm exec -- prettier --write tests/mcp.test.ts
      - name: Commit one formatted test file
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- tests/mcp.test.ts
          git diff --staged --quiet && exit 0
          git commit -m "style(phase3): format authentic MCP auth-context test"
          git pull --ff-only origin phase/03-oauth-identity
          git push origin HEAD:refs/heads/phase/03-oauth-identity
