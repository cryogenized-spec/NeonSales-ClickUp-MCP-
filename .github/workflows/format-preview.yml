name: Phase 4 Quota Test Formatting Preview (Read Only)

on:
  pull_request:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: |
          npx prettier --write tests/phase4-quota.test.ts
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          console.log("FORMATTED:tests/phase4-quota.test.ts::" + encodeURIComponent(fs.readFileSync("tests/phase4-quota.test.ts", "utf8")));
          NODE
