name: Schema Formatting Preview (Read Only)

on:
  pull_request:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: |
          npx prettier --write src/mcp/tool-catalog.ts src/mcp/create-server.ts tests/tool-catalog.test.ts tests/phase4-mcp.test.ts
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          for (const path of [
            "src/mcp/tool-catalog.ts",
            "src/mcp/create-server.ts",
            "tests/tool-catalog.test.ts",
            "tests/phase4-mcp.test.ts",
          ]) {
            console.log("FORMATTED:" + path + "::" + encodeURIComponent(fs.readFileSync(path, "utf8")));
          }
          NODE
