name: Temporary format Phase 3 regression test
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/phase3-once-format.yml
permissions:
  contents: write
jobs:
  normalize:
    if: github.repository == 'cryogenized-spec/NeonSales-ClickUp-MCP-' && github.event.pull_request.head.ref == 'phase/03-oauth-identity' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: phase/03-oauth-identity
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.20.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format regression test with locked Prettier
        run: npm exec -- prettier --write tests/consent.test.ts
      - name: Commit only the normalized test
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- tests/consent.test.ts
          git diff --staged --quiet && exit 0
          git commit -m "style(phase3): apply locked Prettier to consent adversarial tests"
          git pull --ff-only origin phase/03-oauth-identity
          git push origin HEAD:refs/heads/phase/03-oauth-identity
