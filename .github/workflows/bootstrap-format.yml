name: One-time mechanical formatter
# Restricted to the same-repo Phase 2 branch; no application code execution or secrets.
# REMOVE immediately after the formatting commit.
on:
  pull_request:
    branches: [phase/01-perimeter]
    paths:
      - .github/workflows/bootstrap-format.yml

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'cryogenized-spec/NeonSales-ClickUp-MCP-' && github.event.pull_request.head.ref == 'phase/02-sdk-foundation' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: phase/02-sdk-foundation
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.20.0'
      - name: Install exact dependency graph with all lifecycle scripts disabled
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format with project's pinned Prettier version
        run: |
          set -euo pipefail
          npm exec -- prettier --write src tests tsconfig.json wrangler.jsonc package.json eslint.config.js
      - name: Commit formatter output (only allowed files)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests tsconfig.json wrangler.jsonc package.json eslint.config.js
          git diff --staged --quiet && exit 0
          git commit -m "style(phase2): apply pinned Prettier formatting"
          git pull --ff-only origin phase/02-sdk-foundation
          git push origin HEAD:refs/heads/phase/02-sdk-foundation
