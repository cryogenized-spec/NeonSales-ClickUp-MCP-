name: Temporary Native Formatting Preview (Read Only)
on:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: |
          npx prettier --write src/auth/staff.ts src/auth/consent.ts src/auth/oauth-runtime.ts src/auth/authorize.ts src/clickup/policy.ts src/clickup/per-user-oauth.ts src/clickup/client.ts src/clickup/operations.ts src/mcp/create-server.ts tests/consent.test.ts tests/staff.test.ts tests/oauth-runtime.test.ts tests/phase4-mcp.test.ts tests/phase6-native.test.ts
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { execFileSync } from "node:child_process";
          const changed = execFileSync("git", ["diff", "--name-only", "--", "src", "tests"], {encoding:"utf8"}).trim().split("\n").filter(Boolean);
          for (const path of changed) console.log("FORMATTED:" + path + "::" + encodeURIComponent(fs.readFileSync(path, "utf8")));
          NODE
