name: Temporary Native Operations Formatting Preview
on:
  pull_request:
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: |
          npx prettier --write src/clickup/operations.ts tests/phase6-native.test.ts
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { execFileSync } from "node:child_process";
          for (const path of execFileSync("git", ["diff","--name-only","--","src","tests"], { encoding: "utf8" }).trim().split("\n").filter(Boolean)) {
            console.log("FORMATTED:" + path + "::" + encodeURIComponent(fs.readFileSync(path, "utf8")));
          }
          NODE
