name: Temporary Phase 7 Formatting Preview
on:
  pull_request:
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: |
          npx prettier --write src/clickup/catalog-runtime.ts tests/phase7-catalog.test.ts
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { execFileSync } from "node:child_process";
          for (const path of execFileSync("git", ["diff", "--name-only", "--", "src", "tests"], {encoding: "utf8"}).trim().split("\n").filter(Boolean)) {
            console.log("FORMATTED:" + path + "::" + encodeURIComponent(fs.readFileSync(path, "utf8")));
          }
          NODE
