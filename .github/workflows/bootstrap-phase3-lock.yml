name: Phase 3 one-time npm lockfile refresh
# Temporary trusted branch-only workflow; remove immediately after success.
on:
  pull_request:
    branches: [phase/02-sdk-foundation]
    paths: [.github/workflows/bootstrap-phase3-lock.yml]
permissions:
  contents: write
jobs:
  lock:
    if: github.repository == 'cryogenized-spec/NeonSales-ClickUp-MCP-' && github.event.pull_request.head.ref == 'phase/03-oauth-identity' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: phase/03-oauth-identity
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.20.0'
      - name: Produce real npm lockfile, without running dependency scripts
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-exact
          test -z "$(git status --short -- package.json)"
      - name: Commit npm-generated lockfile and nothing else
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json
          git commit -m "build(phase3): lock OAuth and Worker type dependencies"
          git pull --ff-only origin phase/03-oauth-identity
          git push origin HEAD:refs/heads/phase/03-oauth-identity
