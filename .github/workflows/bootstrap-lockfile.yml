name: One-time lockfile security refresh
on:
  pull_request:
    branches: [phase/01-perimeter]
    paths: [.github/workflows/bootstrap-lockfile.yml]
permissions:
  contents: write
jobs:
  refresh:
    if: github.repository == 'cryogenized-spec/NeonSales-ClickUp-MCP-' && github.event.pull_request.head.ref == 'phase/02-sdk-foundation' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: phase/02-sdk-foundation
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.20.0'
      - name: Refresh authentic lockfile without running package code
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-exact
          test -z "$(git status --short -- package.json)"
      - name: Commit refreshed lockfile only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build(phase2): refresh lockfile for security-fixed Wrangler"
          git pull --ff-only origin phase/02-sdk-foundation
          git push origin HEAD:refs/heads/phase/02-sdk-foundation
