name: Temporary Security Fix Format Preview (read only)
on:
  pull_request:
permissions:
  contents: read
jobs:
  formatter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: |
          npx prettier --write src/clickup/operations.ts src/clickup/policy.ts src/mcp/create-server.ts tests/phase6-native.test.ts tests/phase4-mcp.test.ts tests/tool-catalog.test.ts
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { execFileSync } from "node:child_process";
          for (const name of execFileSync("git", ["diff","--name-only","--","src","tests"], {encoding:"utf8"}).trim().split("\n").filter(Boolean)) {
            console.log("FORMATTED:" + name + "::" + encodeURIComponent(fs.readFileSync(name,"utf8")));
          }
          NODE
