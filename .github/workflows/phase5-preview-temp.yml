name: Temporary OAuth format and verification (read-only)
on:
  pull_request:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format in temporary CI workspace and publish exact output
        run: |
          npx prettier --write src/clickup/per-user-oauth.ts src/clickup/user-connection.ts src/auth/env.ts tests/phase4-readonly.test.ts tests/phase4-mcp.test.ts tests/per-user-oauth.test.ts
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          for (const path of [
            "src/clickup/per-user-oauth.ts",
            "src/clickup/user-connection.ts",
            "src/auth/env.ts",
            "tests/phase4-readonly.test.ts",
            "tests/phase4-mcp.test.ts",
            "tests/per-user-oauth.test.ts",
          ]) {
            console.log("FORMATTED:" + path + "::" + encodeURIComponent(fs.readFileSync(path, "utf8")));
          }
          NODE
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
